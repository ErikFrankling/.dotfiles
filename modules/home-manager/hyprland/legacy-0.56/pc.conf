bindle=$mod, U, exec, brightnessctl -c backlight set 10%+
bindle=, xf86monbrightnessdown, exec, brightnessctl -c backlight set 10%-
bindle=$mod, I, exec, brightnessctl -c backlight set 10%-

bindm=$mod, mouse:272, movewindow
