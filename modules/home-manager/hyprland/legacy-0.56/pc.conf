# Rusty Retirement Game Overlay
windowrule = tag +rtr, match:title (Rusty's Retirement)
windowrule = float 1, tag rtr

# Remove this if you don't want rtr to appear in all workspaces
windowrule = pin 1, tag rtr

# windowrule = size 100% 350, tag rtr
windowrule = size 100% 296, tag rtr

# Move rtr to buttom of the screen
# windowrule = move 0 730, tag rtr
windowrule = move 0 784, tag rtr

# The notification popups are deliberately translucent; blurring what
# is behind them is what keeps the text readable over a busy
# wallpaper. ignorealpha skips the fully transparent margin around
# each card so the blur stops at the card itself.
layerrule = blur on, match:namespace notifications
layerrule = ignore_alpha 0.4, match:namespace notifications

windowrule = no_blur 1, tag rtr
windowrule = no_shadow 1, tag rtr
windowrule = border_size 0, tag rtr
# override rounded corners
windowrule = rounding 0, tag rtr
windowrule = opacity 1.0 override, tag rtr

# rules for having it on the right side
# windowrule = size 296 100%, tag rtr_right 

exec-once = hyprctl workspace 10
exec-once = hyprctl workspace 1

# Voxtype switches into this submap (via [output] pre_output_command)
# for the instant it injects each chunk of streamed text, then leaves
# it again (post_output_command -> reset). It is intentionally EMPTY:
# with no binds active, voxtype's synthetic keystrokes can't trigger
# any window shortcut or stop/cancel the session. Text input itself
# still passes through — submaps only gate keybinds, not typing.
submap = voxtype_suppress
submap = reset


windowrule = float 1, match:title ^(T3 Code — Speak reply)$
windowrule = pin 1, match:title ^(T3 Code — Speak reply)$
windowrule = no_initial_focus 1, match:title ^(T3 Code — Speak reply)$
windowrule = size 420 240, match:title ^(T3 Code — Speak reply)$
windowrule = move 70 12, match:title ^(T3 Code — Speak reply)$
