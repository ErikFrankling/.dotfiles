exec-once = /nix/store/8snmq54bp5d5vp5dihgn7xr53hayx629-dbus-1.16.2/bin/dbus-update-activation-environment --systemd DISPLAY HYPRLAND_INSTANCE_SIGNATURE WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE CLAUDE_USE_WAYLAND CODEX_COMPUTER_USE_SCREENSHOT_BACKEND CUA_DRIVER_RS_ENABLE_WAYLAND CUA_DRIVER_RS_TELEMETRY_ENABLED GDK_SCALE GTK2_RC_FILES LOCALE_ARCHIVE_2_27 MOZ_ENABLE_WAYLAND NIXOS_OZONE_WL NIX_XDG_DESKTOP_PORTAL_DIR SCCACHE_BASEDIRS SCCACHE_CACHE_SIZE TMUX_TMPDIR XCURSOR_SIZE XCURSOR_THEME XDG_SESSION_DESKTOP YDOTOOL_SOCKET && systemctl --user stop hyprland-session.target && systemctl --user start hyprland-session.target
exec-shutdown = systemctl --user stop hyprland-session.target
$mod=SUPER
$pip_size=40
animations {
  bezier=myBezier, 0.05, 0.9, 0.1, 1.05
  animation=windows, 1, 7, myBezier
  animation=windowsOut, 1, 7, default, popin 80%
  animation=border, 1, 10, default
  animation=borderangle, 1, 8, default
  animation=fade, 1, 7, default
  animation=workspaces, 0, 6, default
  enabled=true
}

bind=$mod, Return, Exec, kitty
bind=$mod, Q, killactive
bind=$mod SHIFT, G, exit
bind=$mod, F, togglefloating
bind=$mod, A, layoutmsg, preselect l
bind=$mod, P, exec, hyprctl --batch "dispatch setfloating; dispatch pin"
bind=$mod, R, fullscreen
bind=, Print, exec, grimblast copy area
bind=$mod, S, exec, grimblast copy area
bind=, XF86AudioPlay, exec, playerctl play-pause
bind=, XF86AudioNext, exec, playerctl next
bind=, XF86AudioPrev, exec, playerctl previous
bind=$mod, T, tagwindow, +rtr_right title:(Rusty's Retirement)
bind=$mod, T, exec, hyprctl monitor DP-1,addreserved,0,0,296,0
bind=$mod, Y, tagwindow, -rtr_right title:(Rusty's Retirement)
bind=$mod, Y, exec, hyprctl monitor DP-1,addreserved,0,296,0,0
bind=$mod, E, exec, voxtype record toggle
bind=$mod, O, Exec, hyprctl switchxkblayout erik-frankling-dactyl_manuform_5x6_64 next
bind=$mod,1,workspace,name:1
bind=$mod,2,workspace,name:2
bind=$mod,3,workspace,name:3
bind=$mod,4,workspace,name:4
bind=$mod,5,workspace,name:5
bind=$mod,6,workspace,name:6
bind=$mod,7,workspace,name:7
bind=$mod,8,workspace,name:8
bind=$mod,9,workspace,name:9
bind=$mod,0,workspace,name:10
bind=$mod SHIFT,1,movetoworkspace,name:1
bind=$mod SHIFT,2,movetoworkspace,name:2
bind=$mod SHIFT,3,movetoworkspace,name:3
bind=$mod SHIFT,4,movetoworkspace,name:4
bind=$mod SHIFT,5,movetoworkspace,name:5
bind=$mod SHIFT,6,movetoworkspace,name:6
bind=$mod SHIFT,7,movetoworkspace,name:7
bind=$mod SHIFT,8,movetoworkspace,name:8
bind=$mod SHIFT,9,movetoworkspace,name:9
bind=$mod SHIFT,0,movetoworkspace,name:10
bind=$mod,h,movefocus,l
bind=$mod,j,movefocus,d
bind=$mod,k,movefocus,u
bind=$mod,l,movefocus,r
bind=$mod ALT,h,resizeactive,-30 0
bind=$mod ALT,j,resizeactive,0 30
bind=$mod ALT,k,resizeactive,0 -30
bind=$mod ALT,l,resizeactive,30 0
bind=$mod SHIFT,h,swapwindow,l
bind=$mod SHIFT,j,swapwindow,d
bind=$mod SHIFT,k,swapwindow,u
bind=$mod SHIFT,l,swapwindow,r

bindd=$mod, D, Toggle the application launcher, global, quickshell:launcher
bindd=$mod SHIFT, T, Toggle the themes and wallpapers overlay, global, quickshell:looks
bindd=$mod, B, Toggle the keyboard and keybind sheet, global, quickshell:keys
bindd=$mod ALT, Return, Send the spoken reply, exec, /nix/store/3f15nfpagra4arf5fsjdggbzc198znkf-speak-reply-window --send
bindd=$mod ALT, Escape, Close the spoken-reply window, exec, /nix/store/3f15nfpagra4arf5fsjdggbzc198znkf-speak-reply-window --cancel
bindd=$mod ALT, M, Next voice mode (Conversation / Voice out only / Silent), exec, /nix/store/w5i2s77rlbhz4gkxrpk4ib58nhbd9c3p-speak-mode-next

bindl=, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bindle=, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 2%+
bindle=, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
