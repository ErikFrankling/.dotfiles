apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: t3code
  namespace: t3code
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`t3code.erikfrankling.duckdns.org`)
      services:
        - name: t3code-backend
          port: 3773
  tls:
    secretName: t3code-tls
